schema: 1
name: 四层白色建筑
note: >-
  四层白色坡屋顶建筑 (2026-09-13 设计 v2, 按用户反馈重构布局)。
  12000x9000 主体 + 一层东凸支撑房 2700x4200 (托二层大阳台, 11.34m2 约一间房);
  中廊 1500 宽 (y4200-5700) 东西贯通, 6 间房全部开门向走廊;
  楼梯间北移 (x0-2400 x y5700-9000), 3 跑贯通 F1-F4;
  南向主入口门亭 (圆柱 x2 + 门亭板 + 雨篷) 不变;
  三层南小阳台 2400x1500, 栏杆贴墙外皮绕门 (修复栏杆穿门重合);
  外墙 t240 白饰 / 内墙 t120 褐饰; 轴网 1-5/A-D 共 9 条;
  验收基线 墙43 门28 窗39 板12 梯3 栏2 柱2 通用体1
expect_doc: 项目1
